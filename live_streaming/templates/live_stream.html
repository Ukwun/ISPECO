<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Stream</title>
</head>
<body>
  <div id="video-container">
    <video id="video-stream" controls autoplay muted style="width: 100%; max-width: 800px;"></video>
  </div>

  {{ cam_id | json_script:'cameraID'}}
  
  <!-- hls.js for HLS streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <script>
    const cameraID = JSON.parse(document.getElementById('cameraID').textContent);
    const video = document.getElementById('video-stream');

    // Example HLS Stream URL (replace with your actual URL or backend logic)
    const streamUrl = 'http://' + window.location.hostname + ':8000/live/' + cameraID + '.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native support
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function () {
        video.play();
      });
    } else {
      console.error('HLS not supported in this browser.');
    }
  </script>
</body>
</html>
